name: Apuracao e Sincronizacao Bolao F1 V2

on:
  # Permite executar manualmente no botão "Run workflow"
  workflow_dispatch:

  # Agendamento automático aos domingos às 23:05 UTC (20:05 Horário de Brasília)
  schedule:
    - cron: '5 23 * * 0'

# Permissão para o bot gravar e atualizar o bolao.db no repositório
permissions:
  contents: write

jobs:
  executar-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts_v2/requirements.txt'

      - name: Instalar Dependências
        run: |
          pip install -r scripts_v2/requirements.txt

      - name: 1. Coletar Palpites (V2)
        run: |
          python scripts_v2/f1_palpites_v2.py

      - name: 2. Coletar Resultados F1 (V2)
        run: |
          python scripts_v2/f1_agent_v2.py

      - name: 3. Calcular Pontuacao e Atualizar Banco
        run: |
          python scripts_v2/db_calcular.py

      - name: 4. Persistir Banco Atualizado no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts_v2/bolao.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualizar bolao.db pos-corrida [skip ci]" && git push)
