# Configuracao do Netlify para o PWA F1 Bolao 2027

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# Redireciona tudo para index.html (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200